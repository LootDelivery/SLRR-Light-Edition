name: Build Garage TUFA class

on:
  push:
    branches:
      - prototype/garage-ai-speed-limit
    paths:
      - "sl/Scripts/game/src/Garage.java"
      - ".github/workflows/garage-ai-compile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LootDelivery/SLRR-JVM-compiler
          path: compiler
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: compiler/package-lock.json
      - name: Build compiler
        working-directory: compiler
        run: |
          npm ci
          npm run build
      - name: Compile Garage.java into TUFA
        run: |
          node compiler/dist/src/cli.js --root "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/slrr-classes" "$GITHUB_WORKSPACE/sl/Scripts/game/src/Garage.java"
          GENERATED="$RUNNER_TEMP/slrr-classes/sl/Scripts/game/Garage.class"
          test -s "$GENERATED"
          cp "$GENERATED" sl/Scripts/game/Garage.class
          ls -l sl/Scripts/game/Garage.class
      - name: Commit compiled class to this prototype branch
        run: |
          if git diff --quiet -- sl/Scripts/game/Garage.class; then
            echo "Garage.class is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sl/Scripts/game/Garage.class
          git commit -m "Build garage AI speed test TUFA class"
          git push origin "HEAD:$GITHUB_REF_NAME"
