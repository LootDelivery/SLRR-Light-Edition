name: Compile main menu TUFA class

on:
  push:
    branches:
      - feature/main-menu-3d-garage
    paths:
      - sl/Scripts/game/src/MainMenu.java

permissions:
  contents: write

jobs:
  compile-main-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get SLRR TUFA compiler
        run: git clone --depth 1 https://github.com/LootDelivery/SLRR-JVM-compiler.git "$RUNNER_TEMP/slrr-jvm-compiler"

      - name: Build compiler
        working-directory: ${{ runner.temp }}/slrr-jvm-compiler
        run: |
          npm ci
          npm run build

      - name: Compile MainMenu.java
        run: |
          node "$RUNNER_TEMP/slrr-jvm-compiler/dist/src/cli.js" \
            --root "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/slrr-classes" \
            "$GITHUB_WORKSPACE/sl/Scripts/game/src/MainMenu.java"
          cp "$RUNNER_TEMP/slrr-classes/sl/Scripts/game/MainMenu.class" sl/Scripts/game/MainMenu.class

      - name: Commit generated game class
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sl/Scripts/game/MainMenu.class
          if ! git diff --cached --quiet; then
            git commit -m "Build main menu TUFA class"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
